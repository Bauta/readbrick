<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-label="Reader">
  <!-- Open book: two pages meeting at a central spine. The glyph occupies the
       middle ~64% of the 512px viewBox, leaving 18% safe-area margins so the
       same source also looks correct when used in maskable icon shapes. -->
  <g fill="#b6541a">
    <!-- Left page: parallelogram leaning up toward the spine -->
    <path d="M 80 192 L 244 144 L 244 384 L 80 376 Z"/>
    <!-- Right page: mirror -->
    <path d="M 268 144 L 432 192 L 432 376 L 268 384 Z"/>
  </g>
</svg>
